version: '3.8'

services:
  # Strapi 5 Content Backend
  strapi:
    container_name: frontenddevsurajlrg_strapi
    image: node:20-alpine
    working_dir: /opt/app
    volumes:
      - ./apps/backend:/opt/app
    ports:
      - "1337:1337"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 1337
    command: sh -c "npm install && npm run build && npm start"

  # Angular 21 Standalone Frontend Application (FrontendDevSuraJLRG)
  frontend:
    container_name: frontenddevsurajlrg_angular
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./apps/frontend:/app
    ports:
      - "4200:4200"
    environment:
      NODE_ENV: development
    command: sh -c "npm install && npm run start -- --host 0.0.0.0"
    depends_on:
      - strapi

networks:
  default:
    name: frontenddevsurajlrg_network
