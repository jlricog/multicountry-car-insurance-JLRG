<header class="bg-slate-900 text-white shadow-md border-b border-slate-800">
  <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col md:flex-row items-center justify-between gap-4">
    <!-- Logo & Title -->
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-emerald-400 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-blue-500/30">
        🛡️
      </div>
      <div>
        <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
          Insurtech Multi-País
          <span class="text-xs px-2 py-0.5 rounded-full bg-blue-500/20 text-blue-300 border border-blue-500/30 font-medium">
            {{ store.activeCountry().flag }} {{ store.activeCountry().name }}
          </span>
        </h1>
        <p class="text-xs text-slate-400">Cotizador Digital de Seguros de Autos</p>
      </div>
    </div>

    <!-- Country Context Switcher -->
    <div class="flex items-center bg-slate-800/80 p-1 rounded-xl border border-slate-700/60">
      <button
        type="button"
        (click)="selectCountry('CO')"
        [class]="store.currentCountryCode() === 'CO'
          ? 'bg-blue-600 text-white shadow-md font-semibold px-4 py-1.5 rounded-lg text-sm transition-all flex items-center gap-2'
          : 'text-slate-400 hover:text-white px-4 py-1.5 text-sm transition-all flex items-center gap-2'"
      >
        <span>🇨🇴</span> Colombia (COP)
      </button>
      <button
        type="button"
        (click)="selectCountry('CL')"
        [class]="store.currentCountryCode() === 'CL'
          ? 'bg-blue-600 text-white shadow-md font-semibold px-4 py-1.5 rounded-lg text-sm transition-all flex items-center gap-2'
          : 'text-slate-400 hover:text-white px-4 py-1.5 text-sm transition-all flex items-center gap-2'"
      >
        <span>🇨🇱</span> Chile (CLP)
      </button>
    </div>
  </div>

  <!-- Step Indicator Bar -->
  <div class="bg-slate-950/60 border-t border-slate-800 py-3 px-4">
    <div class="max-w-4xl mx-auto flex items-center justify-between">

      <!-- Step 1 -->
      <div class="flex items-center gap-2" [class.opacity-50]="store.currentStep() < 1">
        <div [class]="store.currentStep() >= 1 ? 'w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-sm shadow' : 'w-8 h-8 rounded-full bg-slate-800 text-slate-400 flex items-center justify-center font-bold text-sm'">
          1
        </div>
        <span class="text-sm font-medium hidden sm:inline" [class.text-blue-400]="store.currentStep() === 1" [class.text-slate-300]="store.currentStep() > 1">
          Datos Tomador & Auto
        </span>
      </div>

      <div class="flex-1 h-0.5 bg-slate-800 mx-3"></div>

      <!-- Step 2 -->
      <div class="flex items-center gap-2" [class.opacity-50]="store.currentStep() < 2">
        <div [class]="store.currentStep() >= 2 ? 'w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-sm shadow' : 'w-8 h-8 rounded-full bg-slate-800 text-slate-400 flex items-center justify-center font-bold text-sm'">
          2
        </div>
        <span class="text-sm font-medium hidden sm:inline" [class.text-blue-400]="store.currentStep() === 2" [class.text-slate-300]="store.currentStep() > 2">
          Selección de Plan
        </span>
      </div>

      <div class="flex-1 h-0.5 bg-slate-800 mx-3"></div>

      <!-- Step 3 -->
      <div class="flex items-center gap-2" [class.opacity-50]="store.currentStep() < 3">
        <div [class]="store.currentStep() >= 3 ? 'w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-sm shadow' : 'w-8 h-8 rounded-full bg-slate-800 text-slate-400 flex items-center justify-center font-bold text-sm'">
          3
        </div>
        <span class="text-sm font-medium hidden sm:inline" [class.text-blue-400]="store.currentStep() === 3">
          Resumen y Pago
        </span>
      </div>

    </div>
  </div>
</header>
